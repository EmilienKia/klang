name: CMake build on Ubuntu

on:
  push:
    branches:
      - feature/github-actions-ci
  pull_request:
    branches:
      - feature/github-actions-ci

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      # ── Dependencies ────────────────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            cmake \
            ninja-build \
            pkg-config \
            build-essential \
            libcbor-dev \
            libboost-filesystem-dev \
            libboost-program-options-dev \
            libboost-system-dev \
            nlohmann-json3-dev \
            libfmt-dev \
            catch2 \
            llvm-18-dev \
            clang-18
          sudo apt-get remove -y clang-format-17 clang-tidy-17 clang-tools-17 clang-17 \
            llvm-17-dev llvm-17 llvm-17-runtime llvm-17-tools llvm-17-doc llvm-17-examples \
            clang-format-16 clang-tidy-16 clang-tools-16 clang-16 \
            llvm-16-dev llvm-16 llvm-16-runtime llvm-16-tools llvm-16-doc llvm-16-examples \
            clang-format-15 clang-tidy-15 clang-tools-15 clang-15 \
            llvm-15-dev llvm-15 llvm-15-runtime llvm-15-tools llvm-15-doc llvm-15-examples \
            clang-format-14 clang-tidy-14 clang-tools-14 clang-14 \
            llvm-14-dev llvm-14 llvm-14-runtime llvm-14-tools llvm-14-doc llvm-14-examples

      # ── Configure ───────────────────────────────────────────────────────────
      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build
        run: cmake --build build --parallel $(nproc)

      # ── Tests ────────────────────────────────────────────────────────────────
      - name: Run CTest
        working-directory: build
        run: ctest --output-on-failure --parallel $(nproc)

