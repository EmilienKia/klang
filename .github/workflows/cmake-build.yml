name: CMake build on Ubuntu

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      # ── Dependencies ────────────────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            cmake \
            ninja-build \
            pkg-config \
            build-essential \
            libcbor-dev \
            libgmp-dev \
            libboost-filesystem-dev \
            libboost-program-options-dev \
            liburing-dev \
            libicu-dev \
            nlohmann-json3-dev \
            libfmt-dev \
            catch2 \
            llvm-18-dev \
            clang-18
          # Only remove installed packages: older versions may not exist in this
          # runner's apt repositories.
          installed_packages="$(dpkg-query -W -f='${db:Status-Status} ${binary:Package}\n')"
          packages_to_remove=()
          while read -r status package; do
            if [[ "$status" == installed && "$package" =~ ^(clang(-format|-tidy|-tools)?-(14|15|16|17)|llvm-(14|15|16|17)(-dev|-runtime|-tools|-doc|-examples)?)(:[^[:space:]]+)?$ ]]; then
              packages_to_remove+=("$package")
            fi
          done <<< "$installed_packages"
          if ((${#packages_to_remove[@]})); then
            sudo apt-get remove -y "${packages_to_remove[@]}"
          fi

      # ── Configure ───────────────────────────────────────────────────────────
      - name: Configure CMake
        run: |
          cmake -S . -B cmake-build-debug \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DKLANG_CTEST_TIMEOUT_MULTIPLIER=2.0

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build
        run: ninja -C cmake-build-debug

      # ── Tests ────────────────────────────────────────────────────────────────
      - name: Run CTest
        working-directory: cmake-build-debug
        run: ctest --output-on-failure
